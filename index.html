<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รับเกียรติบัตร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16294D;
      --ink-soft: #4A5878;
      --gold: #B7882C;
      --paper: #FFFFFF;
      --ground: #EDF1F7;
      --line: #C3CCDC;
      --error: #B3261E;
      --serif: 'Noto Serif Thai', 'Sarabun', serif;
      --sans: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--ground);
      color: var(--ink);
      font: 400 17px/1.6 var(--sans);
    }

    /* กรอบสองชั้นแบบใบเกียรติบัตร */
    .frame {
      width: 100%;
      max-width: 460px;
      padding: 44px 36px 40px;
      background: var(--paper);
      border: 1px solid var(--gold);
      box-shadow: inset 0 0 0 7px var(--paper), inset 0 0 0 8px var(--gold);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font: 700 1.75rem/1.3 var(--serif);
    }
    .lead { margin: 0 0 28px; color: var(--ink-soft); }

    label { display: block; margin-bottom: 6px; text-align: left; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input:disabled { background: #F3F5F9; }
    input:focus-visible, .btn:focus-visible {
      outline: 3px solid #7FA6E8;
      outline-offset: 2px;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      font: 600 1rem/1.4 var(--sans);
      color: #fff;
      background: var(--ink);
      border: 0;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: #0E1D38; }
    .btn[disabled] { opacity: .7; cursor: progress; }
    .btn.busy::before {
      content: '';
      display: inline-block;
      width: .9em; height: .9em;
      margin-right: .6em;
      vertical-align: -.1em;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .btn.busy::before { animation: none; } }

    .msg { min-height: 1.6em; margin: 14px 0 0; font-size: .95rem; color: var(--ink-soft); }
    .msg.error { color: var(--error); }

    .result { margin-top: 22px; padding-top: 24px; border-top: 1px solid var(--gold); }
    .result[hidden] { display: none; }
    .result .caption { margin: 0 0 6px; color: var(--ink-soft); font-size: .95rem; }
    .result .name { margin: 0; font: 700 1.5rem/1.4 var(--serif); overflow-wrap: anywhere; }
    .result .college { margin: 4px 0 0; color: var(--ink-soft); overflow-wrap: anywhere; }
    .result .expire { margin: 14px 0 0; font-size: .9rem; color: var(--ink-soft); }


    /* โลโก้หัวหน้า */
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 0 0 20px;
    }
    .logos img { display: block; height: 80px; width: auto; }

    @media (max-width: 420px) {
      .frame { padding: 36px 22px 32px; }
      .logos img { height: 68px; }
    }
  </style>
</head>

  <script>
    (function () {
      // ลิงก์ /exec ของ Apps Script (ถ้า Deploy ใหม่แล้วได้ลิงก์ใหม่ ให้แก้ตรงนี้)
      var API_URL = 'https://script.google.com/macros/s/AKfycbxYtzAqayFBNtFhWj1vu-KlHlsAUYrkpIQgG1GQWNBPDhn7o7s0yPWW38x6J70XSXF6Og/exec';
      var MAX_ATTEMPTS = 3;      // ครั้งแรก + ลองใหม่อัตโนมัติ 2 ครั้ง เมื่อเชื่อมต่อไม่สำเร็จ
      var TIMEOUT_MS = 45000;

      var form = document.getElementById('search');
      var input = document.getElementById('code');
      var submitBtn = document.getElementById('submit');
      var msg = document.getElementById('msg');
      var result = document.getElementById('result');

      function setMsg(text, isError) {
        msg.textContent = text || '';
        msg.className = 'msg' + (isError ? ' error' : '');
      }

      function setBusy(busy) {
        input.disabled = busy;
        submitBtn.disabled = busy;
        submitBtn.classList.toggle('busy', busy);
        submitBtn.textContent = busy ? 'กำลังสร้างเกียรติบัตร' : 'ค้นหาเกียรติบัตร';
        if (busy) {
          result.hidden = true;
          setMsg('ระบบกำลังสร้างไฟล์ ใช้เวลาประมาณ 10 วินาที', false);
        }
      }

      function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      // ส่งคำขอแบบ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight (Apps Script ไม่รองรับ OPTIONS)
      function callApi(code) {
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
        return fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ code: code }),
          signal: ctrl.signal
        })
          .then(function (r) { return r.json(); })
          .then(
            function (data) { clearTimeout(timer); return data; },
            function (err) { clearTimeout(timer); throw err; }
          );
      }

      function callWithRetry(code, attempt) {
        return callApi(code).catch(function (err) {
          // หมดเวลา (AbortError) ไม่ลองซ้ำ เพื่อไม่ให้ซ้ำเติมตอนระบบกำลังคิวยาว
          if (err && err.name === 'AbortError') throw err;
          if (attempt >= MAX_ATTEMPTS) throw err;
          setMsg('การเชื่อมต่อไม่สำเร็จ กำลังลองใหม่อีกครั้ง', false);
          return wait(1500).then(function () { return callWithRetry(code, attempt + 1); });
        });
      }

      input.addEventListener('input', function () {
        result.hidden = true;
        setMsg('');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var code = input.value.trim();
        if (!code) {
          setMsg('กรุณากรอกรหัสเกียรติบัตร', true);
          input.focus();
          return;
        }
        setBusy(true);
        callWithRetry(code, 1)
          .then(function (res) {
            setBusy(false);
            if (!res || !res.ok) {
              setMsg((res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง', true);
              input.focus();
              return;
            }
            if (!/^https:\/\/drive\.google\.com\//.test(res.downloadUrl || '')) {
              setMsg('ได้รับลิงก์ดาวน์โหลดไม่ถูกต้อง กรุณาแจ้งผู้ดูแลระบบ', true);
              return;
            }
            setMsg('');
            document.getElementById('name').textContent = res.name;
            document.getElementById('college').textContent = res.college;
            document.getElementById('download').href = res.downloadUrl;
            result.hidden = false;
          })
          .catch(function () {
            setBusy(false);
            setMsg('เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง หรือเปลี่ยนเครือข่าย', true);
          });
      });
    })();
  </script>
</body>
</html>
